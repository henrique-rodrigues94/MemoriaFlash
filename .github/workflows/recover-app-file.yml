name: Recover App.tsx

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  recover:
    if: github.sha != '4e4cb9d27dba625e0e497b7f022dc7d3937f072d' && github.sha != '230f053952d27203c8b0b3f416f304091e4346ae'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore App.tsx from known-good parent
        run: |
          git checkout 4e4cb9d27dba625e0e497b7f022dc7d3937f072d -- src/App.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: restaurar App.tsx após correção de idioma"
          git push
