name: Fix Study Session typing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch topic typing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/StudySessionView.tsx')
          s = p.read_text()
          old = "deck.cards.map(c => c.topic || c.subject || deck.category)"
          new = "deck.cards.map(c => String(c.topic || c.subject || deck.category || ''))"
          if old not in s:
              raise SystemExit('StudySessionView topic expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/StudySessionView.tsx
          git rm .github/workflows/fix-study-session.yml
          git commit -m 'fix: type study session topics as strings'
          git push
