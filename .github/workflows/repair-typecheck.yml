name: Repair TypeScript preflight

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic typecheck repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/server/ai/tasks/generateFlashcards.ts')
          s = p.read_text()
          s = s.replace("const cards = rawCards.filter((card) => {", "const cards = rawCards.filter((card): card is Record<string, unknown> => Boolean(card && typeof card === 'object'));\n  const normalizedCards = cards.map(card => ({ ...card, topic: topicLabel }));")
          s = s.replace("  }).map(card => ({ ...card, topic: topicLabel }));\n\n  let fixedExplanationCount = 0;\n  const finalCards = cards.map((card) => {", "  });\n\n  let fixedExplanationCount = 0;\n  const finalCards = normalizedCards.map((card) => {")
          p.write_text(s)
          PY

      - name: Verify TypeScript
        run: npm ci && npm run typecheck

      - name: Commit repairs and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-typecheck.yml
          git add src/server/ai/tasks/generateFlashcards.ts
          git commit -m 'fix: finish TypeScript generation typing'
          git push
