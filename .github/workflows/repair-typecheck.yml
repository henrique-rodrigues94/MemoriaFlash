name: Repair TypeScript preflight

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic typecheck repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/server/ai/tasks/generateFlashcards.ts')
          s = p.read_text()
          pattern = r"  const rawCards = extractArrayField\(data, \['cards', 'flashcards'\]\).*?\n  let fixedExplanationCount = 0;\n  const finalCards = cards\.map\(\(card\) => \{"
          replacement = '''  const rawCards = extractArrayField(data, ['cards', 'flashcards']) as Array<Record<string, unknown>>;
  const seen = new Set<string>();
  const cards: Array<Record<string, unknown> & { topic: string }> = [];
  for (const card of rawCards) {
    const front = typeof card?.front === 'string' ? card.front : '';
    const back = typeof card?.back === 'string' ? card.back : '';
    const key = normalizeForDedup(front);
    if (!key || !back.trim() || seen.has(key)) continue;
    seen.add(key);
    cards.push({ ...card, topic: topicLabel });
  }

  let fixedExplanationCount = 0;
  const finalCards = cards.map((card) => {'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'generateFlashcards block replacement failed: {n}')
          p.write_text(s2)
          PY

      - name: Verify TypeScript
        run: npm ci && npm run typecheck

      - name: Commit repairs and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-typecheck.yml
          git add src/server/ai/tasks/generateFlashcards.ts
          git commit -m 'fix: finish TypeScript generation typing'
          git push
