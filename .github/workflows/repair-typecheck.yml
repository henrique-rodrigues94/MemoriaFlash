name: Repair TypeScript preflight

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic typecheck repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/StudySessionView.tsx')
          s = p.read_text()
          pattern = r"const uniqueTopics = useMemo\(\(\) =>\s*Array\.from\(new Set\(\s*deck\.cards\.map\(c => c\.topic \|\| c\.subject \|\| deck\.category\)\.filter\(Boolean\)\s*\)\)\.sort\(\(a, b\) => a\.localeCompare\(b, 'pt-BR'\)\),"
          replacement = "const uniqueTopics: string[] = useMemo(() =>\n    Array.from(new Set<string>(\n      deck.cards.map(c => c.topic || c.subject || deck.category).filter((value): value is string => typeof value === 'string' && value.trim().length > 0)\n    )).sort((a, b) => a.localeCompare(b, 'pt-BR')),"
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n == 0:
              raise SystemExit('StudySessionView uniqueTopics pattern not found')
          p.write_text(s2)
          PY

      - name: Verify TypeScript
        run: npm ci && npm run typecheck

      - name: Commit repairs and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-typecheck.yml
          git add src/components/StudySessionView.tsx
          git commit -m 'fix: finish TypeScript release blockers'
          git push
