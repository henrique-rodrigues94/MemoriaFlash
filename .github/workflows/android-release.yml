name: Android Production Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_APP_ENV: production
      NODE_ENV: production
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_ADMOB_APP_ID: ${{ secrets.VITE_ADMOB_APP_ID }}
      VITE_ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.VITE_ADMOB_BANNER_AD_UNIT_ID }}
      VITE_ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.VITE_ADMOB_INTERSTITIAL_AD_UNIT_ID }}
      VITE_ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.VITE_ADMOB_REWARDED_AD_UNIT_ID }}
      VITE_ADMOB_NATIVE_AD_UNIT_ID: ${{ secrets.VITE_ADMOB_NATIVE_AD_UNIT_ID }}
      VITE_ADMOB_USE_TEST_IDS: 'false'
      VITE_PLAY_MONTHLY_PRODUCT_ID: ${{ secrets.VITE_PLAY_MONTHLY_PRODUCT_ID }}
      VITE_PLAY_MONTHLY_BASE_PLAN_ID: ${{ secrets.VITE_PLAY_MONTHLY_BASE_PLAN_ID }}
      VITE_PLAY_ANNUAL_PRODUCT_ID: ${{ secrets.VITE_PLAY_ANNUAL_PRODUCT_ID }}
      VITE_PLAY_ANNUAL_BASE_PLAN_ID: ${{ secrets.VITE_PLAY_ANNUAL_BASE_PLAN_ID }}
      GOOGLE_PLAY_RTDN_TOKEN: ${{ secrets.GOOGLE_PLAY_RTDN_TOKEN }}
      GEMINI_API_KEY: dummy
      MEMORIAFLASH_KEYSTORE_PATH: ${{ github.workspace }}/android/release-keystore.jks
      MEMORIAFLASH_KEYSTORE_PASSWORD: ${{ secrets.MEMORIAFLASH_KEYSTORE_PASSWORD }}
      MEMORIAFLASH_KEY_ALIAS: ${{ secrets.MEMORIAFLASH_KEY_ALIAS }}
      MEMORIAFLASH_KEY_PASSWORD: ${{ secrets.MEMORIAFLASH_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write production keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo 'ANDROID_KEYSTORE_BASE64 ausente.' && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          test -s android/release-keystore.jks

      - name: Release production preflight
        run: RELEASE_PRODUCTION=true npm run release:check

      - name: Build web with production configuration
        run: npm run build

      - name: Sync Capacitor with production AdMob
        run: npm run android:sync:prod

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android release configuration
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:signingReport --no-daemon
          ./gradlew :app:bundleRelease --no-daemon

      - name: Verify AAB exists
        run: test -s android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: memoriaflash-production-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
