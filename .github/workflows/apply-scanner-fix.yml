name: Apply scanner auth fix

on:
  push:
    branches:
      - agent/fix-document-card-generation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-document-card-generation
          fetch-depth: 0

      - name: Patch scanner upload generation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scanner = Path('src/components/ScannerView.tsx')
          text = scanner.read_text(encoding='utf-8')

          old_import = "import { ECONOMY } from '../services/economy/economyConstants';"
          new_import = "import { ECONOMY } from '../services/economy/economyConstants';\nimport { auth, ensureAuthenticated } from '../lib/firebase';"
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit('ScannerView import anchor not found')
              text = text.replace(old_import, new_import, 1)

          old_fetch = "const res = await fetch('/api/gemini/scanner-process', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ images: [], texts: [], subject: subject.trim() || analysis.subject, count: totalCards, selectedTopics: topicsWithCounts.map(t => t.title), topicsWithCounts, extractedContent: analysis.extractedContent }) });"
          new_fetch = "const user = auth.currentUser || await ensureAuthenticated();\n      const idToken = await user.getIdToken();\n      const res = await fetch('/api/gemini/scanner-process', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${idToken}` }, body: JSON.stringify({ images: [], texts: [], subject: subject.trim() || analysis.subject, count: totalCards, selectedTopics: topicsWithCounts.map(t => t.title), topicsWithCounts, extractedContent: analysis.extractedContent }) });"
          if new_fetch not in text:
              if old_fetch not in text:
                  raise SystemExit('ScannerView scanner-process fetch anchor not found')
              text = text.replace(old_fetch, new_fetch, 1)

          text = text.replace("language: 'pt-BR'", "language: 'pt'", 1)
          scanner.write_text(text, encoding='utf-8')

          server = Path('server.ts')
          server_text = server.read_text(encoding='utf-8')
          old_limit = "app.use(express.json({ limit: '10mb' }));"
          new_limit = "app.use(express.json({ limit: '30mb' }));"
          if old_limit in server_text:
              server_text = server_text.replace(old_limit, new_limit, 1)
          server.write_text(server_text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit patch and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-scanner-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ScannerView.tsx server.ts .github/workflows/apply-scanner-fix.yml
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'fix: restore document flashcard generation'
          git push origin HEAD:agent/fix-document-card-generation
