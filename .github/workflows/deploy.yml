name: Deploy (produção)

# Dispara um deploy automático após o CI passar em `main`.
# Exemplo pronto para Render.com (Deploy Hook). Para outra plataforma, troque
# apenas o passo final por seu CLI/API de deploy (Railway, Fly.io, Cloud Run...).
on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK_URL não configurado — pulando deploy automático."
            echo "Configure em Settings > Secrets and variables > Actions, ou troque este step pelo CLI da sua plataforma (veja docs/DEPLOY.md)."
            exit 0
          fi
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
