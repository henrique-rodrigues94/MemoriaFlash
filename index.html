  </head>
  <body>
    <div id="root"></div>
    <script>
      // O gerador salva os cards ao confirmar. Depois do salvamento, este
      // pequeno adaptador leva o usuário diretamente para Estudar, evitando
      // que ele precise voltar manualmente para a aba principal.
      (() => {
        const processed = new WeakSet();
        const setup = () => {
          document.querySelectorAll('button').forEach((button) => {
            if (processed.has(button)) return;
            const text = (button.textContent || '').trim();
            if (!/^Salvar \d+ Cards no Baralho$/i.test(text)) return;
            processed.add(button);
            button.dataset.returnToStudy = 'true';
            button.setAttribute('aria-label', 'Salvar cards e voltar para Estudar');
            button.addEventListener('click', () => {
              window.setTimeout(() => {
                const studyButton = document.getElementById('nav-btn-home');
                if (studyButton) studyButton.click();
              }, 150);
            });
            const label = Array.from(button.childNodes).find((node) => node.nodeType === Node.TEXT_NODE);
            if (label) label.textContent = ' Voltar para Estudar';
          });
        };
        const observer = new MutationObserver(setup);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        setup();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
